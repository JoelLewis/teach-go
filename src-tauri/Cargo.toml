[package]
name = "gosensei-app"
description = "GoSensei — AI Go tutor desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
default-run = "gosensei-app"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
rusqlite = { version = "0.38", features = ["bundled"] }
rs-fsrs = { workspace = true }
chrono = { workspace = true }
gosensei-core = { path = "../crates/gosensei-core" }
gosensei-katago = { path = "../crates/gosensei-katago" }
gosensei-coaching = { path = "../crates/gosensei-coaching" }
gosensei-llm = { path = "../crates/gosensei-llm", optional = true }
# Shared local-LLM runtime (llama.cpp + Gemma 4), pinned to a rev for
# reproducible builds. Metal is compiled in automatically on macOS via the
# crate's target-specific dependency; a Linux/Windows CUDA build would add
# its "cuda" feature here.
sensei-llm = { git = "https://github.com/JoelLewis/sensei-kit", rev = "95ef866a28b034c43e3c28dd1226f40e548912c0", features = [
    "download",
    "llm",
], optional = true }
reqwest = { version = "0.12", features = ["blocking"] }
sha2 = "0.10"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which = "7"
zip = "2"

tauri-plugin-mcp = { git = "https://github.com/P3GLEG/tauri-plugin-mcp", rev = "49fbecb2dcfac7f5739a79ae22bcf9452dd8d228", optional = true }

[dev-dependencies]
tempfile = "3"

[features]
# mcp stays OUT of default: release builds (tauri-action uses default
# features) must never ship the unauthenticated playtest socket server.
# Use `pnpm playtest` for an mcp-enabled dev build.
default = ["llm"]
mcp = ["tauri-plugin-mcp"]
llm = ["dep:gosensei-llm", "dep:sensei-llm"]
